<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exemple Thymeleaf</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Âge</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="person : ${persons}">
                <td th:text="${person.name}">Exemple</td>
                <td th:text="${person.age} + ' ans'">0</td>
            </tr>
        </tbody>
    </table>

    <h2>Ajouter une personne</h2>
    <form th:action="@{/save}" th:object="${person}" method="post">
        <label for="name">Nom :</label>
        <input type="text" id="name" th:field="*{name}" required>
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        <br>
        <label for="age">Âge :</label>
        <input type="number" id="age" th:field="*{age}" required>
        <span th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
        <br>
        <button type="submit">Ajouter</button>
    </form>

</body>
</html>
