<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page d'Inscription</title>
</head>
<body>
    <!-- remplace la div par le header -->
    <div th:replace="~{fragments/header :: monHeader}"></div>

    <h1>Inscription</h1>
    <form th:action="@{/register}" method="post">
        <label for="username">Nom d'utilisateur :</label>
        <input type="text" id="username" name="username" required>
        <label for="password">Mot de passe :</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">S'inscrire</button>
    </form>
    <p th:if="${param.error}">Identifiants incorrects</p>

    <!-- insère le footer à l'intérieur de la div -->
    <div th:insert="~{fragments/footer :: monFooter}"></div>

</body>
</html>
