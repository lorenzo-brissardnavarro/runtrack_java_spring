
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Achat terminé</title>
</head>
<body>

    <h1>Votre achat est confirmé !</h1>

    <p>Merci <strong th:text="${purchase.customerName}"></strong> pour votre commande.</p>

</body>
</html>
