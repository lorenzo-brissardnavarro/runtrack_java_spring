<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exemple Thymeleaf</title>
</head>
<body>
    <h1>Gestion des personnes</h1>

    <h2>Liste des personnes</h2>
    <ul>
        <li th:each="person : ${persons}" th:text="${person.name + ' a ' + person.age + ' ans'}"></li>
    </ul>

    <h2>Ajouter une personne</h2>
    <form th:action="@{/add}" th:object="${person}" method="post">
        <label for="name">Nom :</label>
        <input type="text" id="name" th:field="*{name}" required>
        <br>
        <label for="age">Âge :</label>
        <input type="number" id="age" th:field="*{age}" required>
        <br>
        <button type="submit">Ajouter</button>
    </form>

</body>
</html>
