<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exemple Thymeleaf</title>
</head>
<body>
    <h1>Gestion des personnes</h1>

    <h2>Liste des personnes</h2>
    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Âge</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="person : ${persons}">
                <td th:text="${person.name}">Exemple</td>
                <td th:text="${person.age} + ' ans'">0</td>
                <td>
                    <form th:action="@{/save}" method="post">
                        <input type="hidden" name="id" th:value="${person.id}" />
                        <label for="name">Nom :</label>
                        <input type="text" id="name" name="name" th:value="${person.name}" required>
                        <br>
                        <label for="age">Âge :</label>
                        <input type="number" id="age" name="age" th:value="${person.age}" required>
                        <br>
                        <button type="submit">Mettre à jour</button>
                    </form>
                    <form th:action="@{/delete}" method="post">
                        <input type="hidden" name="id" th:value="${person.id}" />
                        <button type="submit">Supprimer</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <h2>Ajouter une personne</h2>
    <form th:action="@{/save}" th:object="${person}" method="post">
        <label for="name">Nom :</label>
        <input type="text" id="name" th:field="*{name}" required>
        <br>
        <label for="age">Âge :</label>
        <input type="number" id="age" th:field="*{age}" required>
        <br>
        <button type="submit">Ajouter</button>
    </form>

</body>
</html>
